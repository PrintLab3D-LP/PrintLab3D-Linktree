<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PrintLab 3D</title>

<!-- —— estilos y fuentes que ya tenías (dejé lo tuyo) —— -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>

<style>
body{font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif;margin:0;background:#eef4ff}
header{padding:10px 0;text-align:center}
.logo{width:220px;display:block;margin:0 auto}

/* Estilo del contador */
#visit-counter{
  display:inline-flex;
  align-items:center;
  gap:10px;
  background:#ffffff;
  border:2px solid #28a74522;
  padding:10px 16px;
  border-radius:18px;
  box-shadow:0 8px 18px rgba(0,0,0,.08);
  font-weight:800;
}
#visit-counter .vc-eye{font-size:1.05rem}
#visit-counter .vc-label{opacity:.8;font-weight:800}
#visit-counter .vc-number{font-size:1.15rem; min-width:2ch; text-align:center}
#visit-counter .vc-today{opacity:.85}
#visit-counter .vc-sep{opacity:.25}
#visit-counter #ig-badge svg{display:inline-block; vertical-align:middle}
@media (max-width:480px){
  #visit-counter{gap:8px;padding:8px 12px}
  #visit-counter .vc-label{display:none}
  #visit-counter .vc-sep{display:none}
}
</style>
</head>
<body>

<!-- ======= CONTADOR ======= -->
<div id="visit-counter-wrapper" style="text-align:center; margin:14px 0 10px;">
  <div id="visit-counter" role="status" aria-live="polite" title="Visitas acumuladas y de hoy">
    <span class="vc-eye" aria-hidden="true">👁️</span>
    <span class="vc-label">Visitas:</span>
    <span class="vc-number" id="vc-total">—</span>
    <span class="vc-sep">&nbsp;&nbsp;</span>
    <span class="vc-today" id="vc-today" title="Visitas de hoy">Hoy: —</span>
    <span id="ig-badge" title="Vista desde Instagram" aria-label="Instagram" style="display:none; margin-left:8px; line-height:0;">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="igGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f58529"/>
            <stop offset="30%" stop-color="#dd2a7b"/>
            <stop offset="60%" stop-color="#8134af"/>
            <stop offset="100%" stop-color="#515bd4"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="20" height="20" rx="5" fill="url(#igGrad)"/>
        <circle cx="12" cy="12" r="4.2" fill="none" stroke="white" stroke-width="2"/>
        <circle cx="17.5" cy="6.5" r="1.5" fill="white"/>
      </svg>
    </span>
  </div>
</div>

<header>
  <img alt="PrintLab 3D" class="logo" src="logo.png"/>
</header>

<script>
(function () {
  if (window.__pl3d_lock) return;
  window.__pl3d_lock = true;

  var GAS_URL = "https://script.google.com/macros/s/AKfycbxUpfvVjr6Jr7TKT3_b4U6kmkvXSm6otR16fsJh0z8gFSFTTgLWiUItsqFTO2pnD_LS/exec";

  var totalEl = document.getElementById('vc-total');
  var todayEl = document.getElementById('vc-today');
  var igBadge = document.getElementById('ig-badge');

  var todayISO = new Date().toISOString().slice(0, 10);

  function isInstagram() { return /Instagram/i.test(navigator.userAgent); }
  function getCookie(name) {
    var parts = document.cookie.split('; ');
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].indexOf(name + '=') === 0) {
        return decodeURIComponent(parts[i].substring(name.length + 1));
      }
    }
    return null;
  }
  function setCookie(name, value, days) {
    var d = new Date();
    d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
    document.cookie = name + '=' + encodeURIComponent(value) +
      ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax';
  }
  function setCounts(total, today) {
    if (typeof total === 'number') totalEl.textContent = Number(total).toLocaleString();
    if (typeof today === 'number') todayEl.textContent = 'Hoy: ' + Number(today).toLocaleString();
  }
  function jsonp(action, cbName) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var s = document.createElement('script');
      s.src = GAS_URL + '?action=' + encodeURIComponent(action) + '&jsonp=1&cb=' + cbName + '&t=' + Date.now();
      s.async = true;
      s.onerror = function () { if (!done) { done = true; reject(new Error('onerror')); } };
      var timer = setTimeout(function () { if (!done) { done = true; reject(new Error('timeout')); } }, 3500);
      window[cbName] = function (d) { if (!done) { done = true; clearTimeout(timer); resolve(d); } };
      document.body.appendChild(s);
    });
  }

  var COOKIE_DAY   = 'pl3d_hit_date';
  var CACHE_TOTAL  = 'pl3d_last_total';
  var INFLIGHT     = 'pl3d_inflight_ts';

  function runInstagram() {
    if (igBadge) igBadge.style.display = 'inline';
    try {
      var cached = localStorage.getItem(CACHE_TOTAL);
      totalEl.textContent = cached ? Number(cached).toLocaleString() : '—';

      var already = getCookie(COOKIE_DAY) === todayISO;
      var key = 'pl3d_local_today_' + todayISO;
      var v = parseInt(localStorage.getItem(key) || '0', 10);
      if (!already) { v = v + 1; localStorage.setItem(key, String(v)); setCookie(COOKIE_DAY, todayISO, 1); }
      todayEl.textContent = 'Hoy: ' + v.toLocaleString();
    } catch (e) {
      totalEl.textContent = '—';
      todayEl.textContent = 'Hoy: —';
    }
  }

  async function runNormal() {
    if (igBadge) igBadge.style.display = 'none';
    try {
      var lastTs = Number(sessionStorage.getItem(INFLIGHT) || '0');
      if (Date.now() - lastTs < 10000) {
        try {
          var d0 = await jsonp('get', 'pl3dCBx');
          setCounts(d0.total, d0.today);
          if (typeof d0.total === 'number') localStorage.setItem(CACHE_TOTAL, String(d0.total));
        } catch (e) {}
        return;
      }
    } catch (e) {}

    var already = getCookie(COOKIE_DAY) === todayISO;
    var action  = already ? 'get' : 'hit';
    try { sessionStorage.setItem(INFLIGHT, String(Date.now())); } catch (e) {}

    for (var i = 0; i < 2; i++) {
      try {
        var data = await jsonp(action, 'pl3dCB' + i);
        setCounts(data.total, data.today);
        if (typeof data.total === 'number') localStorage.setItem(CACHE_TOTAL, String(data.total));
        if (!already) setCookie(COOKIE_DAY, todayISO, 1);
        return;
      } catch (e) {}
    }
    totalEl.textContent = '—';
    todayEl.textContent = 'Hoy: —';
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (isInstagram()) { runInstagram(); return; }
    runNormal();
  });
})();
</script>

</body>
</html>
