<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog de PrintLab 3D — Tips, Guías, Novedades y Videos</title>
  <meta name="description" content="Blog de PrintLab 3D: tips, guías, novedades y videos de impresión 3D." />
  <meta name="theme-color" content="#ffa83a" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#fff7f0; --card:#fff; --muted:#5c5c5c; --text:#2b1900; --brand:#ffa83a; --brand-2:#ffcc72; --chip:#fff4e2; --border:#ffe0a6; --shadow:0 8px 20px rgba(255,168,58,.35); --radius:18px; }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    a{color:var(--brand);text-decoration:none}
    a:hover{text-decoration:underline}
    .container{max-width:1100px;margin:0 auto;padding:24px}
    header.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;position:sticky;top:0;background:var(--brand);color:#fff;border-bottom:3px solid var(--brand-2);z-index:50;border-radius:0 0 18px 18px}
    .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
    .logo-dot{width:14px;height:14px;border-radius:50%;background:#fff}
    .nav-links a{color:#fff;font-weight:600;padding:8px 12px;border-radius:12px}
    .nav-links a:hover{background:rgba(255,255,255,.2)}
    .hero{text-align:center;padding:36px 0 8px}
    .hero h1{font-size:clamp(28px,4vw,42px);margin:0;font-weight:800}
    .hero p{margin:8px auto 0;color:var(--muted);max-width:800px;font-size:16px}
    .toolbar{margin:22px 0 8px;display:grid;gap:12px}
    .search{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--border);border-radius:999px;padding:10px 14px;box-shadow:var(--shadow)}
    .search input{border:0;outline:0;width:100%;font-size:15px}
    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip{border:2px solid var(--border);background:var(--chip);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
    .chip.active{border-color:var(--brand);background:var(--brand-2)}
    .grid{display:grid;gap:16px;margin-top:16px}
    @media(min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(min-width:1060px){.grid{grid-template-columns:repeat(3,1fr)}}
    .card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
    .card h3{margin:0;font-size:18px}
    .meta{color:var(--muted);font-size:12px}
    .excerpt{font-size:14px;line-height:1.55}
    .tags{display:flex;gap:6px;flex-wrap:wrap}
    .tag{font-size:12px;color:var(--brand);background:var(--chip);border:1px solid var(--brand-2);padding:6px 10px;border-radius:999px}
    .actions{margin-top:auto}
    .btn{padding:10px 14px;border-radius:12px;font-weight:600;cursor:pointer;background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;border:none}
    .btn:hover{filter:brightness(1.05)}
    footer{border-top:3px solid var(--brand-2);margin-top:30px;background:var(--brand);color:#fff;border-radius:18px 18px 0 0}
    .footer-inner{display:flex;justify-content:space-between;gap:12px;padding:22px 20px;font-size:13px;flex-wrap:wrap}
    .video-embed{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;border:2px solid var(--border);box-shadow:var(--shadow);margin:12px 0}
    .video-embed video{position:absolute;inset:0;width:100%;height:100%;border:0}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
    .modal{width:min(900px,95%);background:var(--card);border:2px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);max-height:90vh;overflow:auto}
    .modal header{padding:18px;border-bottom:2px solid var(--border);background:var(--brand);color:#fff;display:flex;justify-content:space-between}
    .modal .content{padding:18px;line-height:1.65}
    .x{background:#fff;border:2px solid var(--brand);border-radius:10px;padding:6px 10px;color:var(--brand);cursor:pointer}
  </style>
</head>
<body>
  <header class="nav container">
    <div class="logo"><span class="logo-dot"></span><span>PRINTLAB 3D</span></div>
    <nav class="nav-links">
      <a href="/PrintLab3D-Linktree/">Inicio</a>
      <a href="/PrintLab3D-Linktree/catalogo.html">Catálogo</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Blog de PrintLab 3D</h1>
      <p>Tips, guías, novedades y <strong>videos</strong> sobre nuestros productos y procesos de impresión.</p>
    </section>

    <section class="toolbar">
      <div class="search"><input id="q" placeholder="🔍 Buscar en el blog..." /></div>
      <div class="chips" id="chips"></div>
    </section>

    <section id="grid" class="grid"></section>
    <div id="empty" style="display:none;text-align:center;padding:40px">No encontramos resultados.</div>
    <nav id="pagination" class="pagination"></nav>
  </main>

  <footer class="container">
    <div class="footer-inner">
      <span>© <span id="year"></span> PrintLab 3D — Hecho en 3D, hecho para vos.</span>
      <a href="https://www.instagram.com/printlab3d.lp" target="_blank">@printlab3d.lp</a>
    </div>
  </footer>

  <div id="backdrop" class="modal-backdrop">
    <article class="modal">
      <header><h3 id="modalTitle"></h3><button class="x" onclick="closeModal()">✕</button></header>
      <div class="content" id="modalContent"></div>
    </article>
  </div>

<script>
const POSTS = [
  {
    id: "igloo-mania",
    titulo: "Preparación en Bambu Studio: juego Igloo Mania",
    fecha: "2025-07-26",
    tags: ["video","bambu studio","igloo mania","slice","PLA"],
    excerpt: "Paso a paso preparando el juego Igloo Mania en Bambu Studio: orientación, soportes y parámetros de impresión.",
    contenido: `
      <p>En este video muestro cómo preparo el <strong>juego Igloo Mania</strong> en <strong>Bambu Studio</strong>: orientación de piezas, soportes, paredes para resistencia y un g-code optimizado.</p>
      <div class="video-embed">
        <video controls preload="metadata" poster="assets/poster-igloo.jpg">
          <source src="WhatsApp Video 2025-07-26 at 10.15.54.mp4" type="video/mp4">
        </video>
      </div>
    `
  },
  {
    id: "llaveros-emma",
    titulo: "Producción real: llaveros “caritas felices” para el cumple de Emma (4)",
    fecha: "2025-08-22",
    tags: ["video","llaveros","cumple","personalizado"],
    excerpt: "Proceso completo de llaveros personalizados con caritas felices para souvenirs del cumple de 4 años de Emma.",
    contenido: `
      <p>Producción de los llaveros “caritas felices” para el cumple de <strong>Emma (4)</strong>. Diseños con variantes de ojos (<em>corazón</em>, <em>rayo</em>, etc.) como souvenirs resistentes y coloridos.</p>
      <div class="video-embed">
        <video controls preload="metadata" poster="assets/poster-emma.jpg">
          <source src="WhatsApp Video 2025-08-22 at 13.43.45.mp4" type="video/mp4">
        </video>
      </div>
    `
  },
  {
    id: "capibara-timelapse",
    titulo: "Timelapse: Porta palitos de olor en forma de capibara 🦫",
    fecha: "2025-07-13",
    tags: ["video","timelapse","capibara","decoración"],
    excerpt: "Impresión completa en timelapse de un porta palitos de olor con forma de capibara para baño u hogar.",
    contenido: `
      <p>Timelapse de la impresión de un <strong>porta palitos de olor</strong> con forma de <strong>capibara</strong>. Ideal como objeto decorativo para el baño o cualquier ambiente.</p>
      <div class="video-embed">
        <video controls preload="metadata" poster="assets/poster-capibara.jpg">
          <source src="video_2025-07-13_22-31-56 (1).mp4" type="video/mp4">
        </video>
      </div>
    `
  }
];

const state = { q:"", tag:null, page:1, perPage:6 };
const chipsEl = document.getElementById('chips');
const gridEl = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const paginationEl = document.getElementById('pagination');

function uniqueTags(){ const set=new Set(); POSTS.forEach(p=>p.tags.forEach(t=>set.add(t))); return Array.from(set).sort(); }
function buildChips(){
  chipsEl.innerHTML='';
  const all=document.createElement('button'); all.className='chip'+(!state.tag?' active':''); all.textContent='Todos'; all.onclick=()=>{state.tag=null;state.page=1;render();}; chipsEl.appendChild(all);
  uniqueTags().forEach(t=>{ const b=document.createElement('button'); b.className='chip'+(state.tag===t?' active':''); b.textContent=t; b.onclick=()=>{state.tag=t;state.page=1;render();}; chipsEl.appendChild(b); });
}
function filterPosts(){
  let list=POSTS.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  if(state.tag) list=list.filter(p=>p.tags.includes(state.tag));
  if(state.q){ const q=state.q.toLowerCase(); list=list.filter(p=>p.titulo.toLowerCase().includes(q)||p.excerpt.toLowerCase().includes(q)); }
  return list;
}
function paginate(list){ const start=(state.page-1)*state.perPage; return list.slice(start,start+state.perPage); }
function card(p){
  const el=document.createElement('article'); el.className='card';
  el.innerHTML=`<h3>${p.titulo}</h3><div class="meta">${new Date(p.fecha).toLocaleDateString('es-AR')}</div><div class="excerpt">${p.excerpt}</div><div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="actions"><button class="btn" onclick="openModal('${p.id}')">Leer más</button></div>`;
  return el;
}
function render(){
  const list=filterPosts(); const pageCount=Math.max(1,Math.ceil(list.length/state.perPage));
  if(state.page>pageCount) state.page=pageCount;
  const pageItems=paginate(list); gridEl.innerHTML=''; pageItems.forEach(p=>gridEl.appendChild(card(p)));
  emptyEl.style.display=list.length?'none':'block'; paginationEl.innerHTML='';
  for(let i=1;i<=pageCount;i++){ const b=document.createElement('button'); b.textContent=i; b.className='chip'+(i===state.page?' active':''); b.onclick=()=>{state.page=i;render();}; paginationEl.appendChild(b); }
}
function openModal(id){ const p=POSTS.find(x=>x.id===id); document.getElementById('modalTitle').textContent=p.titulo; document.getElementById('modalContent').innerHTML=p.contenido; document.getElementById('backdrop').style.display='flex'; }
function closeModal(){ document.getElementById('backdrop').style.display='none'; }

document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;state.page=1;render();});
document.getElementById('year').textContent=new Date().getFullYear();
buildChips(); render();
</script>
</body>
</html>
